# 公開リポジトリ向け無料 GitHub Actions（標準ランナー）
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: secret-and-naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: secret_guard
        run: |
          mapfile -t files < <(git ls-files)
          python scripts/secret_guard.py check-paths "${files[@]}"
      - name: naming_check
        run: |
          mapfile -t files < <(git ls-files)
          python scripts/naming_check.py check-paths "${files[@]}"

  api:
    name: api-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Pytest
        env:
          PYTHONPATH: apps/api
        run: python -m pytest -q

  web:
    name: web-lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm build:shared
      - name: Lint
        run: pnpm lint:web
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Design token check
        run: pnpm check:design-tokens
