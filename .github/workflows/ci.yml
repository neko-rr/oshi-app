# 公開リポジトリ向け無料 GitHub Actions（標準ランナーのみ）
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # next build 用ダミー（実秘密ではない。公開テンプレ相当）
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder
  NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

jobs:
  guard:
    name: secret-and-naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: secret_guard
        run: |
          mapfile -t files < <(git ls-files)
          python scripts/secret_guard.py check-paths "${files[@]}"
      - name: naming_check
        run: |
          mapfile -t files < <(git ls-files)
          python scripts/naming_check.py check-paths "${files[@]}"

  api:
    name: api-compile-pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: compileall
        run: python -m compileall -q apps/api/app
      - name: Pytest
        env:
          PYTHONPATH: apps/api
        run: python -m pytest -q

  web:
    name: web-lint-typecheck-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm build:shared
      - name: Lint
        run: pnpm lint:web
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Production build
        run: pnpm build:web

  design:
    name: design-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design tokens
        run: python scripts/check_design_tokens.py
      - name: Design icons sync
        run: python scripts/sync_design_icons.py --check
      - name: Design compliance
        run: python scripts/check_design_compliance.py

  docs:
    name: docs-generated-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      # product docs の OpenAPI 抽出で FastAPI を import する場合がある
      - name: Install API deps (for OpenAPI extract)
        run: pip install -r apps/api/requirements.txt
      - name: Docs drift check
        env:
          PYTHONPATH: apps/api
        run: python scripts/check_docs_drift.py
